[OctoFog]
Enabled=1

; Multiplies WoW's requested fog density when EXP/EXP2 fog is used.
DensityMultiplier=1.35

; Pulls linear fog toward the player.
; 1.0 = leave start/end unchanged, 0.75 = 25% closer.
StartMultiplier=0.70
EndMultiplier=0.82

; Hard safety floor in world units so fog never starts directly on the camera.
MinimumStart=8.0
MinimumEnd=32.0

; Optional fog-colour blend toward the tint below.
; 0.0 = use WoW's original zone/weather fog colour.
; 1.0 = replace it completely.
TintStrength=0.08
TintR=0.72
TintG=0.78
TintB=0.82

; Write OctoFog.log next to WoW.exe.
Logging=1
