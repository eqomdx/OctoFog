name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-x86:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure x86
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/d3d9.dll dist/d3d9.dll
          Copy-Item OctoFog.ini dist/OctoFog.ini
          Copy-Item README.md dist/README.md
          Copy-Item TESTING.md dist/TESTING.md
          $hash = (Get-FileHash dist/d3d9.dll -Algorithm SHA256).Hash.ToLower()
          "d3d9.dll  sha256:$hash" | Set-Content dist/CHECKSUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoFog-win32
          path: dist/
